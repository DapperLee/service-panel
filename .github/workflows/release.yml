name: Release

# 推送 v* tag 时自动构建三平台安装包并生成 Release 草稿
on:
  push:
    tags:
      - 'v*'

# 创建 Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    strategy:
      # 一个平台失败不取消其它平台的构建
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
          - platform: macos-latest
          - platform: ubuntu-latest
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # 缓存 Rust 编译产物，按平台区分；第二次构建能快很多
      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.platform }}

      # Tauri v2 on Linux 需要 webkit2gtk-4.1 等系统依赖
      - name: Install Linux system deps (Tauri v2)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install frontend deps
        run: npm ci

      # 发布前先跑一遍单元测试，红了该平台就不出包
      - name: Run tests
        run: cargo test --lib

      - name: Build & Release (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Service Panel ${{ github.ref_name }}'
          releaseBody: '安装包见下方 Assets：Windows (.msi/.exe)、macOS (.dmg/.app)、Linux (.deb/.AppImage)。更新内容见提交记录。'
          releaseDraft: true
          prerelease: false
